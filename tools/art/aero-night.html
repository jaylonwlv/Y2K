<!doctype html>
<!--
  Aero Night wallpaper (stars, aurora, teal horizon glow), from the .night background in home2.html.
  Drawn at 440 x 956 pt and rendered at 3x (1320 x 2868) by tools/render-art.mjs. Original art.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 956px; overflow: hidden; }
  .bg { position: relative; width: 440px; height: 956px; overflow: hidden;
    background: radial-gradient(700px 520px at 50% 115%, #0b4d5c, transparent 62%),
                linear-gradient(180deg, #01060f 0%, #03101f 45%, #031a24 100%); }
  .aur { position: absolute; border-radius: 50%; filter: blur(46px); }
  .star { position: absolute; width: 1.6px; height: 1.6px; border-radius: 50%; background: #fff; }
</style>
</head>
<body>
<div class="bg" id="bg">
  <i class="aur" style="left:-90px;top:250px;width:460px;height:170px;background:#11d9ad;opacity:.75;transform:rotate(-20deg)"></i>
  <i class="aur" style="left:150px;top:340px;width:420px;height:150px;background:#1b72ff;opacity:.7;transform:rotate(-26deg)"></i>
  <i class="aur" style="left:-60px;top:600px;width:560px;height:200px;background:#0fa8b8;opacity:.45;transform:rotate(10deg)"></i>
</div>
<script>
  // Same seeded stars as the mockup, so exports match it.
  let seed = 11;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const bg = document.getElementById('bg');
  for (let i = 0; i < 46; i++) {
    const s = document.createElement('i');
    s.className = 'star';
    s.style.cssText = `left:${rnd() * 440}px;top:${rnd() * 520}px;opacity:${0.25 + rnd() * 0.7}`;
    bg.prepend(s);
  }
</script>
</body>
</html>
