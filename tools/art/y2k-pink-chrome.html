<!doctype html>
<!--
  Y2K Pink Chrome wallpaper. Rendered to PNG by tools/render-art.mjs.
  Canvas: 1320 x 2868 (iPhone 16/17 Pro Max native pixels). iOS aspect-fills it on
  other devices, so keep important art away from the far left/right edges.
  All art is original: pure CSS gradients + an SVG sparkle.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1320px; height: 2868px; overflow: hidden; }
  .wall {
    position: relative; width: 1320px; height: 2868px; overflow: hidden;
    background:
      radial-gradient(55% 22% at 0% 0%, #aef0e6 0%, rgba(174,240,230,0) 100%),
      radial-gradient(55% 20% at 100% 0%, #fcf3b8 0%, rgba(252,243,184,0) 100%),
      radial-gradient(60% 18% at 55% 10%, #e3f8cf 0%, rgba(227,248,207,0) 100%),
      radial-gradient(55% 22% at 0% 30%, #bfc8f7 0%, rgba(191,200,247,0) 100%),
      radial-gradient(60% 20% at 100% 28%, #f8d6d4 0%, rgba(248,214,212,0) 100%),
      radial-gradient(70% 25% at 30% 60%, #e9c3f3 0%, rgba(233,195,243,0) 100%),
      radial-gradient(70% 25% at 90% 75%, #f4bde6 0%, rgba(244,189,230,0) 100%),
      linear-gradient(180deg, #cdf1ea 0%, #e2e6f4 20%, #e3d0f4 42%, #efc6ec 66%, #e9bdf2 86%, #e3b8f3 100%);
  }
  /* holographic rainbow sheen sweeping diagonally */
  .holo {
    position: absolute; inset: -20%;
    background: linear-gradient(118deg,
      rgba(255,255,255,0) 18%,
      rgba(140,235,255,.30) 26%, rgba(170,255,190,.26) 31%, rgba(255,245,150,.26) 36%,
      rgba(255,180,210,.28) 41%, rgba(200,170,255,.28) 46%, rgba(255,255,255,0) 54%,
      rgba(255,255,255,0) 64%, rgba(255,190,235,.25) 72%, rgba(190,200,255,.22) 78%, rgba(255,255,255,0) 86%);
    mix-blend-mode: soft-light;
  }
  /* fine diagonal foil lines */
  .foil {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(110deg,
      rgba(255,255,255,0) 0px, rgba(255,255,255,0) 40px,
      rgba(255,255,255,.55) 42px, rgba(255,255,255,0) 45px, rgba(255,255,255,0) 58px);
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,.55) 35%, rgba(0,0,0,.8) 65%, rgba(0,0,0,.5) 100%);
    opacity: .55;
  }
  .glow {
    position: absolute; border-radius: 50%; filter: blur(80px);
  }
  .sphere {
    position: absolute; border-radius: 50%;
    background:
      radial-gradient(circle at 34% 26%, rgba(255,255,255,1) 0%, rgba(255,255,255,.95) 7%, rgba(255,255,255,0) 22%),
      radial-gradient(circle at 70% 82%, rgba(255,205,240,.85) 0%, rgba(255,205,240,0) 32%),
      radial-gradient(circle at 40% 36%, #f4f1fb 0%, #dcd7ee 22%, #b9b2d8 46%, #9890c0 64%, #7f78ab 76%, #a79fcd 88%, #e5dff5 100%);
    box-shadow:
      0 40px 80px rgba(150, 105, 190, .28),
      inset -18px -26px 40px rgba(255, 190, 235, .35),
      inset 10px 12px 30px rgba(255, 255, 255, .5);
  }
  .sparkle { position: absolute; filter: drop-shadow(0 0 10px rgba(255,255,255,.95)) drop-shadow(0 0 22px rgba(255,200,240,.8)); }
</style>
</head>
<body>
<div class="wall">
  <div class="holo"></div>
  <div class="foil"></div>

  <div class="glow" style="left:-160px; top:1780px; width:700px; height:500px; background:rgba(255,190,240,.45)"></div>
  <div class="glow" style="left:820px; top:540px; width:600px; height:420px; background:rgba(255,236,210,.45)"></div>

  <!-- chrome spheres: top-right (peeks behind icons), left-middle (half off screen), right-bottom -->
  <div class="sphere" style="left:895px; top:112px; width:216px; height:216px"></div>
  <div class="sphere" style="left:-158px; top:1404px; width:430px; height:430px"></div>
  <div class="sphere" style="left:990px; top:1920px; width:360px; height:360px"></div>

  <!-- sparkles -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <path id="spark" d="M0,-50 C4,-8 8,-4 50,0 C8,4 4,8 0,50 C-4,8 -8,4 -50,0 C-8,-4 -4,-8 0,-50Z" fill="#fff"/>
    </defs>
  </svg>
  <svg class="sparkle" style="left:84px;  top:2146px" width="64" height="64" viewBox="-50 -50 100 100"><use href="#spark"/></svg>
  <svg class="sparkle" style="left:606px; top:2150px" width="48" height="48" viewBox="-50 -50 100 100"><use href="#spark"/></svg>
  <svg class="sparkle" style="left:1196px; top:1668px" width="70" height="70" viewBox="-50 -50 100 100"><use href="#spark"/></svg>
  <svg class="sparkle" style="left:180px; top:1408px" width="52" height="52" viewBox="-50 -50 100 100"><use href="#spark"/></svg>
  <svg class="sparkle" style="left:1100px; top:420px" width="34" height="34" viewBox="-50 -50 100 100"><use href="#spark"/></svg>
  <svg class="sparkle" style="left:150px; top:560px" width="30" height="30" viewBox="-50 -50 100 100"><use href="#spark"/></svg>
  <svg class="sparkle" style="left:760px; top:2560px" width="36" height="36" viewBox="-50 -50 100 100"><use href="#spark"/></svg>
</div>
</body>
</html>
